name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build shared package
        run: npx tsc
        working-directory: packages/shared
      - name: Typecheck API
        run: npx tsc --noEmit
        working-directory: apps/api
      - name: Build web
        run: npx next build
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  test:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build shared package
        run: npx tsc
        working-directory: packages/shared
      - name: Run vitest
        run: npx vitest run
        working-directory: apps/api
