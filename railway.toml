# ─── API Service (default Railway config) ───
#
# Railway detectează acest fișier automat.
# Build context = root repo (monorepo cu workspaces).
#
# IMPORTANT: Fiecare serviciu Railway trebuie configurat separat.
# Acest fișier se aplică doar serviciului PRINCIPAL (api).
# Web + Worker se configurează din Railway Dashboard.

[build]
  builder = "DOCKERFILE"
  dockerfilePath = "apps/api/Dockerfile"

[deploy]
  startCommand = "node dist/index.js"
  healthcheckPath = "/health"
  healthcheckTimeout = 60
  restartPolicyType = "ON_FAILURE"

# ─── Railway Project Setup (3 services + 2 plugins) ───
#
# 1. API Service (uses this config)
#    - Dockerfile: apps/api/Dockerfile
#    - Start: node dist/index.js
#    - Port: 8080
#    - Health: /health
#
# 2. Web Service (configure in Railway Dashboard)
#    - Dockerfile: apps/web/Dockerfile
#    - Start: node apps/web/server.js
#    - Port: 3000
#
# 3. Worker Service (configure in Railway Dashboard)
#    - Dockerfile: apps/api/Dockerfile (same as API)
#    - Start override: node dist/jobs/worker.js
#    - No port, no health check
#
# Plugins:
#    - PostgreSQL → DATABASE_URL
#    - Redis → REDIS_URL
